name: test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu.lock
      - name: Set up pinned CPU environment
        run: ./scripts/dev.ps1 -Task Setup -Python python
      - name: Check sources, license receipts and contracts
        run: ./scripts/dev.ps1 -Task Check
