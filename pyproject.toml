[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-embedders"
version = "0.1.1"
description = "Pinned RVC fairseq, current RVC and Applio embedder acquisition and verified ONNX export"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "torch==2.7.1",
  "transformers==4.44.2",
  "onnx==1.19.1",
  "onnxruntime==1.23.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
vc-embedders = "vc_embedders.cli:main"

[tool.setuptools.package-data]
vc_embedders = ["catalog.json", "release_catalog.json"]

[tool.setuptools.packages.find]
include = ["vc_embedders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
